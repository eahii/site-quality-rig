name: full-battery

# The two-engine battery, kept out of the required gate on purpose. The engine policy and the
# numbers behind it are in ci.yml; the short version is that webkit is a dated receipt here
# rather than a tax on every push.
#
# Measured 2026-08-27 at 611824e on the author's machine: 525 s for the battery itself,
# chromium+webkit, 869 cells, browsers already installed. The delta this job carries over the
# required gate is therefore about 265 s of measuring plus a second engine install. That delta
# is small enough that moving webkit into ci.yml is a one-line change if a webkit-only defect
# ever ships — `npm test` without `--engines` is already the two-engine run.
#
# No push trigger: a daily run bounds a webkit-only regression to under 24 h, which is the
# honest trade at this repo's commit rate.
#
# Executed for the first time on 2026-08-29, dispatched by hand against main at 85aedbe: run
# 33258911560, green, ubuntu-24.04, node v20.20.2, playwright 1.62.1. The browser cache key
# below missed, because a key is only populated by a run and this job had never had one.
#
#   npm test                  chromium+webkit   869 cells   598 s  (536 s local at 44deb74)
#   npx playwright install    both engines                   52 s  (--with-deps, cache MISS)
#   whole job                                               670 s
#
# Those two wall times are derived, not printed — this job emits no WALL_SECONDS. They are
# subtractions over the run's own timestamps: battery step 14:57:49Z-15:07:47Z, job
# 14:56:46Z-15:07:56Z. So the runner took 11.6% longer than the 536 s the same battery took
# locally at 44deb74, and 13.9% longer than the 525 s at 611824e above — the same order as the
# 12-16% per-step gap ci.yml measured for the chromium job. One run is not a distribution.

on:
  schedule:
    # 04:17 UTC, off the top of the hour where GitHub's scheduled-run queue is most congested.
    # Two things a reader should know before citing this as "runs daily": cron only ever fires
    # on the default branch, and GitHub disables scheduled workflows after 60 days without
    # repository activity. Check the run history, not this line.
    - cron: '17 4 * * *'
  # Dispatch can target any branch, which is how demo/failing-gate gets a two-engine red run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-engine:
    name: full battery (chromium + webkit)
    runs-on: ubuntu-24.04
    # 525 s measured for the battery itself (2026-08-27) plus two engine installs, on a runner
    # whose slowdown was an unmeasured factor when this was written. It is measured now: the
    # first execution of this job, 2026-08-29, took 670 s end to end (598 s of it the battery),
    # i.e. about 5x headroom under the hour. Left at 60 — one run is not a distribution.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Resolve the pinned playwright version
        id: pw
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Distinct key from ci.yml's: this job needs a second engine on disk, and a cache entry
      # holding only chromium would restore, satisfy the key, and never grow webkit.
      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium-webkit

      # webkit needs system libraries beyond chromium's; --with-deps is what installs them.
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run build

      # No --engines flag: the checkers default to chromium,webkit, which is the whole point
      # of this job. The negative controls are not repeated here — they are chromium-only by
      # design and ci.yml already runs them on every push.
      - name: Battery (7 checkers, both engines)
        run: npm test

      - name: Preserve screenshots from the red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-two-engine
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
