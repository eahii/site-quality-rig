name: ci

# The required gate: chromium only, battery then negative controls.
#
# Engine policy, and the measurements it rests on. Re-measured 2026-08-27 at 611824e on the
# author's machine — node v22.22.2, playwright 1.62.1, browsers already installed:
#
#   npm test                          chromium+webkit   869 cells    525 s
#   npm test -- --engines chromium    chromium only     555 cells    260 s
#   npm run test:controls             chromium only     7 controls   101 s
#
# An earlier version of this file put the two-engine battery at "~20 min" and rested the split
# on that. The figure was wrong by a factor of about two; it is corrected here rather than
# quietly dropped, and the split is kept for reasons that are not about wall time:
#
#   - the negative controls are chromium-only by design, so this job is already a one-engine
#     instrument; adding webkit to it mixes two cadences in one required check;
#   - the one engine-specific flake anyone here has seen is a webkit one — float32 layout rects
#     made a genuine 44px control measure 43.999755859375 and the row went red in 6 of 12
#     identical runs (checks/measure-viewports.js:123-127). Those runs happened while this rig
#     was being extracted and no artifact in this repo witnesses them: that comment is
#     provenance for this split, not a receipt. A required gate is still the worst place for
#     that class of red, and a dated nightly is the right place;
#   - webkit is not dropped. full-battery.yml runs both engines daily and on demand, and that
#     is no longer only a claim about a file: it was dispatched on demand for the first time on
#     2026-08-29 and went green on all 869 two-engine cells (run 33258911560, 598 s of battery
#     against this job's 290 s of chromium). Its own header carries the figures.
#
# Measured on a runner for the first time on 2026-08-29, run 33255702213, ubuntu-24.04, node
# v20.20.2, playwright 1.62.1, cold browser install:
#
#   npm test -- --engines chromium    555 cells    290 s   (260 s on the machine above)
#   npm run test:controls             7 controls   117 s   (101 s on the machine above)
#   npx playwright install            chromium      26 s   (cache miss; see the note below)
#   whole job                                      450 s
#
# So the runner is about 12-16% slower per step, and the 45-minute timeout below is roughly 6x
# the observed job. It stays where it is: three runs are not a distribution.
#
# The next run, 33256223839, was the first to hit the browser cache, and it is the reason the
# cache step is documented rather than trusted:
#
#   cache restore                                    5 s
#   npx playwright install            chromium      20 s   (cache HIT, vs 26 s on a miss)
#   battery / controls / whole job         288 s / 116 s / 450 s
#
# The cache saves about 6 s, not the 26 s the miss line above might suggest, because
# `--with-deps` still does its apt work on a hit. Keeping it is fine — it costs nothing and the
# step is a stated speed-up, never a correctness dependency — but nobody should cite it as a
# meaningful saving. Note also that the cache only populates after a GREEN run: a red run skips
# the post step that saves it, which is why runs 1 and 2 both paid the full download.
#
# Every cell count above matched the author's machine exactly, which is what pinning buys: the
# runner and the local machine resolved the same Chrome for Testing build (151.0.7922.34) via
# playwright 1.62.1, so no pixel assertion had to be made environment-aware.

on:
  push:
    branches:
      - main
      # demo/failing-gate carries a committed fixture defect on purpose, so this workflow is
      # EXPECTED to finish red there. That red run is the point: it is the linkable evidence
      # that these gates fire, without anyone having to clone the repo to see it.
      - demo/failing-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  chromium-gate:
    name: chromium gate (battery + negative controls)
    # Pinned rather than ubuntu-latest: the environment is part of every stamp this repo
    # prints, and a runner image that moves underneath the receipts makes them unreproducible.
    runs-on: ubuntu-24.04
    # 260 s + 101 s on the machine in the note above, i.e. about six minutes of work. The
    # runner is slower by an unmeasured factor and installs a browser first, so 45 is headroom
    # against an unknown rather than a target.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # package.json declares node >=18. Running the gate on 20 rather than on the author's
      # local v22.22.2 (the runtime stamped in docs/CONTROLS.md) is deliberate: it keeps a
      # 22-only API from slipping in behind a green check.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Resolve the pinned playwright version
        id: pw
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A speed-up, never a correctness dependency: the install below runs unconditionally, so
      # a cache miss costs download time and changes nothing about what is verified.
      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # scripts/run-checks.js forwards every argument to every checker, so one flag narrows
      # the whole battery to one engine.
      - name: Battery (7 checkers, chromium)
        run: npm test -- --engines chromium

      # controls/run-controls.js requires a checker to be GREEN on the pristine build before it
      # will credit that checker's red on a mutated copy. demo/failing-gate ships a deliberately
      # broken fixture, so no baseline there can be green and the suite cannot reach 7/7 — that
      # is the baseline rule working as designed, not a regression, so it is not a signal there.
      - name: Negative controls (7 defect injections)
        if: github.ref_name != 'demo/failing-gate' && github.head_ref != 'demo/failing-gate'
        run: npm run test:controls

      # The mirror image of the step above: three cases where a real defect is injected and the
      # checker stays GREEN on purpose, each pinned between a green baseline and a red proof that
      # the defect exists. Same branch condition, and for the same reason — every case starts from
      # a baseline run on the pristine build, and demo/failing-gate has no green baseline to offer.
      - name: Known misses (3 documented limits, demonstrated)
        if: github.ref_name != 'demo/failing-gate' && github.head_ref != 'demo/failing-gate'
        run: npm run test:known-miss

      # The comparison tool that reads run records has its own six-leg control, and it is the
      # cheapest thing in this job: no browsers, no fixture, synthetic records in memory. It
      # says nothing about the site, only about whether a diff of two runs can be trusted to
      # name the right checker — so `if: always()` rather than the default `if: success()`,
      # which would skip it on demo/failing-gate, the one branch where the battery above is
      # red by design. Same reason the artifact step below carries `if: failure()`.
      - name: Control (compare-runs self-test)
        if: always()
        run: node scripts/compare-runs.js --control

      # Only on red: a green run's screenshots are not evidence of anything worth downloading.
      - name: Preserve screenshots from the red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-chromium-gate
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
